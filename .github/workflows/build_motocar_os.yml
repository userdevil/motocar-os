name: Build MotoCar OS Universal ARM64 ROM (All Phones)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-motocar-rom:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout MotoCar OS Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs e2tools p7zip-full zip unzip xz-utils curl python3

      - name: Build MotoCar OS Universal GSI System Image
        run: |
          chmod +x tools/build_cloud_gsi.py
          sudo python3 tools/build_cloud_gsi.py
          sudo chown -R $USER:$USER .

      - name: Upload MotoCar OS Universal Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            MotoCarOS-Universal-ARM64-*-system.img.xz
            MotoCarOS-Universal-ARM64-*-Fastboot.zip
          draft: false
          prerelease: false
          name: "MotoCar OS Universal Head Unit Release"
          body: |
            ### MotoCar OS - Pure Dedicated In-Vehicle Head Unit OS (Bike & Car)
            
            This is the official, universal operating system image converting any ARM64 Android phone into a dedicated motorcycle/car headunit.
            
            #### Scoped Strictly to Your Required Features:
            - **Phone Screen Mirroring**: 60fps low-latency video projection.
            - **Navigation via Phone GPS**: Live Google Maps / Waze turn-by-turn navigation streamed from your phone.
            - **Dual-Band Wi-Fi (2.4 GHz & 5 GHz)**: Full 2.4 GHz (Channels 1–11) support for universal phone connection + 5 GHz high-speed streaming.
            - **Bluetooth Audio Stack**: A2DP Sink bridge routing calls & audio to helmet intercoms (Sena/Cardo) or car speakers.
            - **USB Connectivity & Charging**: Plug-and-play wired projection via USB AOA 2.0 with continuous power charging.
            - **All Displays & Dual Orientation**: 
              - **Bike Portrait (9:16)** on handlebar stem mounts.
              - **Bike / Car Landscape (16:9)** on handlebar bars and dashboards.
              - **Banking Gyro Lock**: Prevents accidental screen flipping when banking in motorcycle turns.
            - **Zero Bloat / Pure Appliance**: Completely debloats telephony, cellular dialers, SMS, and setup wizards. Bypasses lockscreens for direct boot.
            
            #### How to Flash:
            ```bash
            fastboot reboot fastboot
            fastboot flash system system.img
            fastboot -w
            fastboot reboot
            ```

      - name: Upload Artifacts (Manual Run)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: MotoCarOS-Universal-ARM64
          path: |
            MotoCarOS-Universal-ARM64-*-system.img.xz
            MotoCarOS-Universal-ARM64-*-Fastboot.zip
