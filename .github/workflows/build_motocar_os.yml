name: Build MotoCar OS Universal ARM64 ROM (All Phones)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-motocar-rom:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout MotoCar OS Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs e2tools p7zip-full zip unzip xz-utils curl python3

      - name: Build MotoCar OS Universal GSI System Image
        run: |
          chmod +x tools/build_cloud_gsi.py
          python3 tools/build_cloud_gsi.py

      - name: Upload MotoCar OS Universal Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            MotoCarOS-Universal-ARM64-v1.0-system.img.xz
            MotoCarOS-Universal-ARM64-v1.0-Fastboot.zip
          draft: false
          prerelease: false
          name: "MotoCar OS Universal ARM64 Release"
          body: |
            ### MotoCar OS v1.0 - Universal Automotive ROM for All Android Phones
            
            This is the official compiled operating system image for converting any ARM64 Android phone into a dedicated Motorcycle/Car Head Unit.
            
            #### Features:
            - **Universal Compatibility**: Boots on all Project Treble ARM64 Android phones.
            - **Motorcycle & Car Dual Orientation**: Landscape (16:9) and Portrait (9:16) with banking angle lock.
            - **Phone Screen Mirroring & App Streaming**: Low latency H.264 video decoding.
            - **High-gain GPS Navigation Relay**: Streaming Google Maps / Waze directly from the driver's phone.
            - **Connectivity**: 5GHz Wi-Fi (TCP 5277), USB AOA 2.0 with fast charging, and Bluetooth A2DP Sink audio bridge to helmet intercoms (Cardo/Sena) and car audio.
            - **Kiosk Direct Boot**: Bypasses lockscreen, setup wizard, and phone bloatware.
            
            #### How to Flash:
            ```bash
            fastboot reboot fastboot
            fastboot flash system system.img
            fastboot -w
            fastboot reboot
            ```

      - name: Upload Artifacts (Manual Run)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: MotoCarOS-Universal-ARM64
          path: |
            MotoCarOS-Universal-ARM64-v1.0-system.img.xz
            MotoCarOS-Universal-ARM64-v1.0-Fastboot.zip
